name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test browser flows against disposable synthetic data
        run: npm run test:e2e
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
